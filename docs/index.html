<!doctype html>
<html lang="en" data-glaze-theme="celadon">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Glaze component documentation, live examples and themes for ReactiveScript."
    />
    <meta name="theme-color" content="#fafaf9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
    />
    <title>Glaze · Component library</title>
    <script>
      {
        const root = document.documentElement;
        // Puts the saved theme on the page. A choice that isn't saved goes back to its default, so this can
        // run a second time.
        const restore = () => {
          try {
            for (const [key, values] of Object.entries({
              Theme: [
                "porcelain",
                "celadon",
                "terracotta",
                "cobalt",
                "raku",
                "oxblood",
                "majolica",
                "kintsugi",
              ],
              Mode: ["system", "light", "dark"],
              Finish: ["satin", "gloss"],
              Font: ["system", "serif", "mono"],
              Shadow: ["flat", "raised"],
              Density: ["compact", "roomy"],
            })) {
              const value = localStorage.getItem("glaze" + key);
              if (values.includes(value)) root.dataset["glaze" + key] = value;
              else if (key === "Theme") root.dataset.glazeTheme = "celadon";
              else delete root.dataset["glaze" + key];
            }
            const radius = localStorage.getItem("glazeRadius");
            if (radius && +radius >= 0 && +radius <= 1)
              root.style.setProperty("--radius", +radius + "rem");
            else root.style.removeProperty("--radius");
            const translucency = localStorage.getItem("glazeTranslucency");
            if (translucency && +translucency >= 0 && +translucency <= 1)
              root.style.setProperty("--translucency", String(+translucency));
            else root.style.removeProperty("--translucency");
          } catch {}
        };
        restore();
        const follow = () => {
          restore();
          document.dispatchEvent(new Event("glaze-theme-change"));
        };
        // A change made in another page of the site: another tab, or the page whose link this one was
        // prerendered from (see the speculation rules below), which read the theme when the link was hovered.
        // Following the change as it is made means a prerendered page already has the theme when it is shown.
        window.addEventListener("storage", (event) => {
          if (event.key === null || event.key.startsWith("glaze")) follow();
        });
        // In case the page is shown before that event arrives.
        if (document.prerendering)
          document.addEventListener("prerenderingchange", follow, { once: true });
      }
    </script>
    <!--
      Chrome and Edge render a page of the docs in the background as soon as a link to it is hovered (on a
      phone: as it scrolls into view), so the click shows a finished page. Other browsers ignore the block.
      Links within the current page are left out: they would take one of the two pages Chrome keeps ready.
    -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "where": {
              "and": [
                { "href_matches": "/*" },
                {
                  "not": {
                    "selector_matches": "[href^='#'], [aria-current='page'], [target], [download]"
                  }
                }
              ]
            },
            "eagerness": "eager"
          }
        ]
      }
    </script>
    <link rel="stylesheet" href="./site.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="topbar">
      <a class="brand" href="?" aria-label="Glaze home"
        ><svg class="mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
          <clipPath id="mark-jar">
            <path
              d="M11 2.5h10a1.5 1.5 0 0 1 0 3h-.3v1.2C26.5 8.8 30 13 30 18c0 5-3.2 9.2-8 10.4v.4a1.2 1.2 0 0 1-1.2 1.2h-9.6a1.2 1.2 0 0 1-1.2-1.2v-.4C5.2 27.2 2 23 2 18c0-5 3.5-9.2 9.3-11.3V5.5H11a1.5 1.5 0 0 1 0-3z"
            />
          </clipPath>
          <path
            class="mark-clay"
            d="M11 2.5h10a1.5 1.5 0 0 1 0 3h-.3v1.2C26.5 8.8 30 13 30 18c0 5-3.2 9.2-8 10.4v.4a1.2 1.2 0 0 1-1.2 1.2h-9.6a1.2 1.2 0 0 1-1.2-1.2v-.4C5.2 27.2 2 23 2 18c0-5 3.5-9.2 9.3-11.3V5.5H11a1.5 1.5 0 0 1 0-3z"
          />
          <g clip-path="url(#mark-jar)">
            <path
              d="M0 0h32v14h-3.5q-1.5 0-1.5 1.5V18a2.5 2.5 0 0 1-5 0v-1.8a1.5 1.5 0 0 0-3 0V22a3 3 0 0 1-6 0v-5.8a1.5 1.5 0 0 0-3 0V17a2.5 2.5 0 0 1-5 0v-1.5Q5 14 3.5 14H0z"
            />
            <path
              class="mark-shine"
              d="M7.3 13.2a1.3 1.3 0 0 1-1.2-1.8 10.5 10.5 0 0 1 4.3-4.6 1.3 1.3 0 0 1 1.3 2.25 7.9 7.9 0 0 0-3.2 3.4 1.3 1.3 0 0 1-1.2.75z"
            />
          </g></svg
        >Glaze</a
      >
      <span class="doc-label">Documentation</span>
      <div class="top-actions">
        <a class="install-link" href="?page=installation"
          >Installation <span data-glaze="icon" data-icon="arrow-up-right" aria-hidden="true"></span
        ></a>
        <div id="theme-menu"></div>
        <button
          class="mobile-menu"
          aria-controls="sidebar"
          aria-expanded="false"
          aria-label="Open navigation"
        >
          <span data-glaze="icon" data-icon="menu" aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <div class="frame">
      <aside id="sidebar">
        <label class="finder"
          ><span data-glaze="icon" data-icon="search" aria-hidden="true"></span
          ><input
            type="search"
            name="q"
            autocomplete="off"
            id="search"
            aria-label="Find a component"
            placeholder="Find a component…"
          /><kbd>/</kbd></label
        >
        <nav aria-label="Documentation" id="navigation"></nav>
      </aside>
      <main id="main" tabindex="-1"></main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
